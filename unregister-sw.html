<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Unregister Service Workers</title>
  <style>body{font-family:Inter,Arial,Helvetica,sans-serif;padding:32px;color:#0b1726}pre{background:#f6f8fb;padding:16px;border-radius:8px}</style>
</head>
<body>
  <h1>Unregister Service Workers</h1>
  <p>This page will attempt to unregister any service workers for this origin, then reload the homepage.</p>
  <pre id="out">Running…</pre>
<script>
(async function(){
  const out = document.getElementById('out');
  if (!('serviceWorker' in navigator)){
    out.textContent = 'ServiceWorker not supported in this browser.';
    return;
  }
  try{
    const regs = await navigator.serviceWorker.getRegistrations();
    if (!regs || regs.length === 0) {
      out.textContent = 'No service workers registered.';
    } else {
      out.textContent = 'Found ' + regs.length + ' registration(s). Unregistering...';
      const results = await Promise.all(regs.map(r => r.unregister()));
      out.textContent = 'Unregistered ' + results.filter(Boolean).length + ' service worker(s).';
    }
  } catch (err){
    out.textContent = 'Error: ' + err;
  }
  setTimeout(()=>{
    out.textContent += '\nReloading homepage...';
    // Attempt to reload the site root which should be served by your dev server
    try{ window.location.href = '/'; }catch(e){ /* ignore */ }
  }, 1200);
})();
</script>
</body>
</html>
